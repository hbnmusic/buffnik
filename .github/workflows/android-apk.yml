name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write # to publish the APK as a GitHub Release
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm ci

      - name: Type-check and test
        run: |
          npm run typecheck
          npm test

      - name: Generate native Android project
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        # On failure, surface Gradle's "What went wrong" section as an annotation so it
        # can be read from the run summary without opening the full log.
        run: |
          set -o pipefail
          cd android
          if ! ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            msg=$( (grep -A 30 "What went wrong" "$RUNNER_TEMP/gradle.log" || tail -n 60 "$RUNNER_TEMP/gradle.log") | head -n 80 \
              | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r//g' -e 's/\n/%0A/g')
            echo "::error title=Gradle build failed::${msg}"
            exit 1
          fi

      # Re-sign with Buffnik's own key when the repo secrets exist. Without them the APK keeps
      # the default key from the Expo template, which is the same on every run, so updates
      # still install over each other, but it is a publicly known key.
      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.BUFFNIK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUFFNIK_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUFFNIK_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUFFNIK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          OUT=buffnik-${{ github.run_number }}.apk
          if [ -n "${KEYSTORE_BASE64}" ]; then
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/buffnik.jks"
            "$BT/apksigner" sign --ks "$RUNNER_TEMP/buffnik.jks" \
              --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
              --out "$OUT" "$APK"
            "$BT/apksigner" verify --print-certs "$OUT" | grep -E "SHA-256 digest|DN:"
            rm -f "$RUNNER_TEMP/buffnik.jks"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "::warning::No Buffnik signing key in repo secrets; APK uses the template's default key."
            cp "$APK" "${OUT%.apk}-defaultkey.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: buffnik-apk-${{ github.run_number }}
          path: buffnik-*.apk
          retention-days: 30

      # Only builds signed with Buffnik's own key become releases, so the phone always
      # downloads an APK that installs over the previous one.
      - name: Publish GitHub Release
        if: env.SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" "buffnik-${{ github.run_number }}.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Buffnik build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}." \
            --latest
